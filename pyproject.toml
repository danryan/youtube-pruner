[tool.poetry]
name = "youtube-pruner"
version = "0.1.0"
description = "CLI tool to identify and remove stale YouTube subscriptions"
authors = []
packages = [{include = "youtube_pruner"}]

[tool.poetry.dependencies]
python = "^3.10"
google-auth = "^2.0"
google-auth-oauthlib = "^1.0"
google-api-python-client = "^2.0"
python-dateutil = "^2.8"
python-dotenv = "^1.0"

[tool.poetry.scripts]
youtube-pruner = "youtube_pruner.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
